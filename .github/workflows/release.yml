# Semantic-release for Mad Skills.
#
# - push to main / workflow_dispatch on main → publish tag + GitHub Release + skill zips
# - push to other branches / PRs targeting main → dry-run (no tag, no release, no assets)
#
# Dry-run still uses full history + tags so the would-be version matches what main would cut.

name: Release

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Semantic release (dry-run)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Dry-run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Running semantic-release --dry-run (no publish)."
          # Capture output; fail the job if semantic-release itself fails.
          if ! npx semantic-release --dry-run 2>&1 | tee /tmp/semrel-dry-run.log; then
            echo "::error::semantic-release dry-run failed"
            exit 1
          fi
          if grep -Eq 'The next release version is [0-9]' /tmp/semrel-dry-run.log; then
            version="$(grep -Eo 'The next release version is [0-9][^ ]*' /tmp/semrel-dry-run.log | tail -1 | awk '{print $NF}')"
            echo "::notice::Would-be next version on main: ${version}"
            echo "would_be_version=${version}"
          elif grep -Eqi 'no (new )?release|nothing to release|does not trigger a release' /tmp/semrel-dry-run.log; then
            echo "::notice::No release would be produced from these commits on main"
            echo "would_be_version=none"
          else
            echo "::notice::Dry-run completed; check logs above for the would-be version"
          fi

  publish:
    name: Semantic release (publish)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
